<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'UA-18195919-3');


  $(document).one('shiny:idle',
      function() {
        ga('set','userId', Shiny.user);
      }
     );

  });
